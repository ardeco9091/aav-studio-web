<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Sistema RRHH Frut&amp;Em</title>
  <desc id="desc">Mockup de sistema de recursos humanos con fichadas, liquidacion de sueldos y exportaciones.</desc>
  <defs>
